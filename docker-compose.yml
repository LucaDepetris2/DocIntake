# Local development stack.
#   cp .env.example .env
#   docker compose up --build                      # postgres, rabbitmq, api, worker, flower
#   docker compose --profile demo run --rm seed    # load synthetic firms/matters
name: docintake

x-backend: &backend
  # One image shared by api, worker, flower, migrate and seed (built once).
  image: docintake-backend:dev
  build: ./backend
  env_file: .env
  volumes:
    - storage:/data/storage
    - ./backend/models:/app/models:ro

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI (the documents.dlq queue is visible here)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: apply migrations, then exit. API and workers wait for it to succeed.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *backend
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--concurrency=2", "-Q", "documents"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  flower:
    <<: *backend
    # $$ escapes $ for compose: the variables are expanded inside the container, from .env.
    command: ["sh", "-c", "celery -A app.workers.celery_app flower --port=5555 --basic-auth=$${FLOWER_BASIC_AUTH} --broker_api=http://$${RABBITMQ_DEFAULT_USER}:$${RABBITMQ_DEFAULT_PASS}@rabbitmq:15672/api/"]
    ports: ["5555:5555"]
    depends_on:
      rabbitmq: { condition: service_healthy }

  seed:
    <<: *backend
    profiles: ["demo"]
    command: ["python", "-m", "app.cli.seed", "--data", "/seed/matters.json"]
    volumes:
      - ./scripts/output:/seed:ro
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  storage:
