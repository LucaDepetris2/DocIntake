global:
  scrape_interval: 5s

# DNS service discovery: every replica of a compose service is found automatically
# (docker compose up --scale worker=N, or deploy.replicas in production).
scrape_configs:
  - job_name: api
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 8000

  # Each worker container serves the aggregate of its prefork children on :9100.
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
