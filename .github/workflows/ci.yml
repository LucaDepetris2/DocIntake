name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy app tests

      - name: Tests (unit + integration via testcontainers)
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
        env:
          INTEGRATION_DB: testcontainers

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t docintake-backend ./backend
